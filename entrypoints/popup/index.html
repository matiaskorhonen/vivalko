<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vivalko</title>
    <meta name="manifest.type" content="browser_action" />
    <!-- Grey by default; the background worker turns it red on Alko.fi tabs. -->
    <meta name="manifest.default_icon" content='{ "16": "icon/inactive/16.png", "32": "icon/inactive/32.png" }' />
  </head>
  <body>
    <main>
      <h1>Vivalko</h1>
      <p class="lede">Vivino ratings on Alko.fi</p>
      <label class="row">
        <input type="checkbox" id="enabled" />
        <span>Show ratings</span>
      </label>
      <p class="hint" id="reload-hint" hidden>Reload Alko tabs to apply.</p>
      <section class="cache">
        <p id="stats">…</p>
        <button type="button" id="clear">Clear cache</button>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
